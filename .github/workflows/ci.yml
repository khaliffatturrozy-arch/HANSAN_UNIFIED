name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, unit tests, build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck
        env:
          NEXT_TELEMETRY_DISABLED: "1"

      - name: Unit and integration tests
        run: npm test

      - name: Production build
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"

      - name: Production dependency audit
        run: npm audit --omit=dev --audit-level=high

  postgres:
    name: PostgreSQL validation
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run disposable-database PostgreSQL validation
        run: npm run test:postgres
        env:
          HANSAN_TEST_POSTGRES_URL: postgresql://postgres:postgres@localhost:5432/postgres

      - name: Prepare restart persistence probe
        run: node scripts/postgres-restart-check.mjs prepare
        env:
          HANSAN_TEST_POSTGRES_URL: postgresql://postgres:postgres@localhost:5432/postgres
          HANSAN_RESTART_STATE_FILE: ${{ runner.temp }}/hansan-pg-restart.json

      - name: Restart the PostgreSQL server container
        run: |
          container_id="$(docker ps -q --filter ancestor=postgres:17)"
          test -n "$container_id"
          docker restart "$container_id"
          for attempt in $(seq 1 30); do
            if docker exec "$container_id" pg_isready -U postgres; then
              exit 0
            fi
            sleep 1
          done
          echo "PostgreSQL did not become ready after restart" >&2
          exit 1

      - name: Verify persistence after server restart
        run: node scripts/postgres-restart-check.mjs verify
        env:
          HANSAN_TEST_POSTGRES_URL: postgresql://postgres:postgres@localhost:5432/postgres
          HANSAN_RESTART_STATE_FILE: ${{ runner.temp }}/hansan-pg-restart.json

  e2e:
    name: Playwright E2E
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run isolated browser workflow
        run: npm run test:e2e
        env:
          PLAYWRIGHT_BROWSER: chromium
          NEXT_TELEMETRY_DISABLED: "1"
